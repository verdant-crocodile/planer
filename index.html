<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#1D0B26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ночной планер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
/* Layout: шапка и полоса недели сверху; ниже лента цветных блоков дня и боковая колонка (на узком экране друг под другом).
   Палитра: глубокий сливовый фон с мягкими пятнами света, блоки в дофаминовых парах «фон + текст». */
:root {
  --bg: #1D0B26;
  --panel: rgba(48, 20, 62, 0.72);
  --panel-solid: #2A1236;
  --line: rgba(255, 234, 252, 0.12);
  --line-2: rgba(255, 234, 252, 0.24);
  --fg: #FFF4FB;
  --muted: #CDB6D9;
  --soft: #E6D6EE;
  --accent: #F6F67B;
  --on-accent: #3A0F4A;
  --blush: #FFA296;
  --lime: #BEDA62;
  --danger: #FF9C8C;
  --scrim: rgba(14, 4, 20, 0.7);
  --glow-1: rgba(161, 68, 197, 0.55);
  --glow-2: rgba(255, 162, 150, 0.32);
  --glow-3: rgba(190, 218, 98, 0.22);
  --glow-4: rgba(157, 150, 255, 0.30);
  --font-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
.glow { position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40% 45% at 8% 4%, var(--glow-1), transparent 70%),
    radial-gradient(38% 40% at 92% 8%, var(--glow-2), transparent 70%),
    radial-gradient(42% 40% at 85% 95%, var(--glow-3), transparent 70%),
    radial-gradient(40% 40% at 15% 92%, var(--glow-4), transparent 70%);
  filter: blur(10px); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { position: relative; z-index: 1; height: 100%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-block: 20px 0; padding-inline: 16px; }
@media (min-width: 700px) { .app { padding-inline: 28px; padding-block: 24px 0; } }

.top { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-weight: 600; font-size: 14px; }
.actions { margin-left: auto; display: flex; gap: 8px; }
.glass { background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.icon-btn { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; padding: 0; }
.btn { min-height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 800; }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }

.week { display: flex; gap: 8px; }
.week .icon-btn { height: auto; width: 40px; }
.days { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day-btn { height: 68px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; }
.day-btn .wd { font-size: 12px; font-weight: 600; color: var(--muted); }
.day-btn .n { font-family: var(--font-display); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.day-btn .load { display: flex; gap: 2px; height: 5px; max-width: 80%; overflow: hidden; border-radius: 3px; }
.day-btn .load i { display: block; height: 100%; flex: none; }
.day-btn.is-today .n { color: var(--accent); }
.day-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day-btn[aria-pressed="true"] .wd, .day-btn[aria-pressed="true"] .n { color: var(--on-accent); }

.main { flex: 1; min-height: 0; display: flex; gap: 24px; }
.daycol { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.daylist { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 28px 4px; }

/* Питомец */
.pet-lane { position: relative; flex: none; height: 214px; border-radius: 22px; overflow: hidden; }
.pet-cap { position: absolute; left: 16px; top: 12px; right: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; pointer-events: none; }
.pet-cap b { font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--accent); }
.pet-cap span { font-size: 13px; font-weight: 600; color: var(--muted); }
.pet-track { position: absolute; left: 16px; right: 16px; bottom: 12px; border-top: 2px dashed var(--line-2); }
.pet-track::before, .pet-track::after { content: ""; position: absolute; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); }
.pet-track::before { left: -4px; }
.pet-track::after { right: -4px; background: var(--blush); }
.pet { --x: 0.1; position: absolute; bottom: 10px; left: calc(16px + (100% - 32px - 140px) * var(--x)); width: 140px; height: 166px; padding: 0; border: none; background: transparent; border-radius: 20px; transition-property: left; transition-timing-function: ease-in-out; transition-duration: 1s; }
.pet-jump, .pet-flip, .pet-bob { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; }
.pet-flip { transition: transform .25s; }
.pet.face-left .pet-flip { transform: scaleX(-1); }
.pet-img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; pointer-events: none; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; filter: drop-shadow(0 6px 14px rgba(161, 68, 197, 0.35)); }
.pet-shadow { position: absolute; left: 18%; right: 18%; bottom: -2px; height: 10px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); filter: blur(3px); }
.pet.cheer .pet-shadow { animation: shadow .75s ease-out; }
@keyframes shadow { 45% { transform: scale(.6); opacity: .5; } }
.pet .body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
.pet .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
.pet .eyes-happy { display: none; }
.pet.cheer .eyes-happy { display: inline; }
.pet.cheer .eyes { display: none; }
.pet.walking .pet-bob { animation: waddle .32s ease-in-out infinite alternate; }
.pet.walking .foot-l { animation: step .32s ease-in-out infinite alternate; }
.pet.walking .foot-r { animation: step .32s ease-in-out infinite alternate-reverse; }
.pet .foot-l, .pet .foot-r { transform-box: fill-box; transform-origin: 50% 0; }
.pet.cheer .pet-jump { animation: jump .75s cubic-bezier(.3,.7,.4,1); }
.bubble { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 800; padding: 5px 11px; border-radius: 12px; pointer-events: none; }
.bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--accent); }
.fx { position: absolute; width: 16px; height: 16px; pointer-events: none; animation: rise 1.1s ease-out forwards; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .975); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes waddle { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-5px); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes jump { 0% { transform: scale(1, 1); } 15% { transform: scale(1.08, .9); } 45% { transform: translateY(-30px) scale(.95, 1.06); } 75% { transform: translateY(0) scale(1.06, .93); } 100% { transform: scale(1, 1); } }
@keyframes rise { from { opacity: 1; transform: translate(0, 0) scale(.6) rotate(0); } to { opacity: 0; transform: translate(var(--dx), -70px) scale(1.2) rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { .pet, .pet * { animation: none !important; } .fx { display: none; } }
.side { width: 320px; flex: none; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 0 28px; }
@media (max-width: 899px) {
  .app { height: auto; min-height: 100%; }
  .main { flex-direction: column; }
  .daylist, .side { overflow: visible; padding-right: 0; }
  .side { width: auto; }
}
@media (max-width: 520px) {
  .pet-lane { height: 176px; }
  .pet { width: 112px; height: 132px; left: calc(16px + (100% - 32px - 112px) * var(--x)); }
  .top h1 { font-size: 22px; }
  .day-btn { height: 58px; border-radius: 12px; }
  .days { gap: 4px; }
  .week .icon-btn { width: 32px; }
}

.row { display: flex; align-items: center; gap: 12px; }
.row .t { width: 46px; flex: none; font-weight: 700; font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
.card { flex: 1; min-width: 0; border-radius: 18px; padding: 0 6px 0 10px; display: flex; align-items: center; gap: 4px; background: var(--cb); color: var(--cf); transition: opacity .2s, transform .15s; }
.card:active { transform: scale(0.99); }
.card.is-done { opacity: 0.5; }
.card.is-done .title { text-decoration: line-through; }
.card.is-now { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--cb), 0 10px 30px -8px var(--cb); }
.check { width: 30px; height: 30px; flex: none; border-radius: 10px; border: 2.5px solid var(--cf); background: transparent; display: grid; place-items: center; padding: 0; color: var(--cb); }
.check svg { visibility: hidden; }
.is-done .check { background: var(--cf); }
.is-done .check svg { visibility: visible; }
.open { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 10px; background: transparent; border: none; text-align: left; padding: 0 8px; color: var(--cf); border-radius: 12px; }
.open .title { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.open .meta { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; font-size: 13px; font-weight: 700; white-space: nowrap; }
.spark { flex: none; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--cf); color: var(--cb); }
.rep { display: inline-flex; }
.gap { margin-left: 58px; min-height: 34px; border: 1.5px dashed var(--line-2); border-radius: 14px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; text-align: left; }
.gap:hover { color: var(--accent); border-color: var(--accent); }

.note { border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--soft); margin-bottom: 6px; }
.note p { margin: 0; flex: 1 1 260px; }
.empty { border: 1.5px dashed var(--line-2); border-radius: 20px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--muted); }
.empty strong { color: var(--fg); font-family: var(--font-display); font-weight: 500; font-size: 17px; }

.panel { border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.panel.lit { background: var(--cb); color: var(--cf); border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.panel.lit .label, .panel.lit .muted { color: var(--cf); opacity: 0.85; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.now-title { font-family: var(--font-display); font-size: 18px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
.muted { color: var(--muted); font-weight: 600; font-size: 14px; }
.bar { position: relative; height: 8px; border-radius: 4px; overflow: hidden; }
.bar::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0.2; }
.bar i { position: relative; display: block; height: 100%; border-radius: 4px; background: currentColor; }
.panel.lit .btn { background: var(--cf); color: var(--cb); border-color: var(--cf); }
.panel.lit .btn.ghost { background: transparent; color: var(--cf); }
.prog { flex-direction: row; align-items: center; gap: 18px; }
.prog .big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--cb); background: transparent; color: var(--fg); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--cb); }
.chip[aria-pressed="true"] { background: var(--cb); color: var(--cf); }
.chip[aria-pressed="true"]::before { background: var(--cf); }
.inbox-form { display: flex; gap: 8px; }
.field { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(14, 4, 20, 0.35); padding: 0 12px; font-size: 15px; }
.field:focus { border-color: var(--accent); outline: none; }
select.field { appearance: none; -webkit-appearance: none; background-color: var(--panel-solid); }
.todo { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.todo input { width: 20px; height: 20px; accent-color: var(--lime); flex: none; margin: 0; }
.todo label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.todo.is-done label { text-decoration: line-through; color: var(--muted); }
.x { width: 36px; height: 36px; border: none; background: transparent; border-radius: 10px; color: var(--muted); display: grid; place-items: center; padding: 0; flex: none; }
.x:hover { color: var(--fg); background: var(--line); }
.link-btn { background: none; border: none; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: 14px; align-self: flex-start; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 2px; }
.tag { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 999px; background: var(--cb); color: var(--cf); font-size: 13px; font-weight: 800; }

.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6); }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 20px; }
.sheet h3 { margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.f { display: flex; flex-direction: column; gap: 6px; }
.f > span { font-size: 13px; font-weight: 700; color: var(--soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; border: none; padding: 0; margin: 0; min-width: 0; }
.cats legend { font-size: 13px; font-weight: 700; color: var(--soft); padding: 0; margin-bottom: 8px; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 999px; background: var(--cb); color: var(--cf); font-weight: 800; font-size: 14px; cursor: pointer; opacity: 0.55; transition: opacity .15s, transform .15s; }
.opt input:checked + span { opacity: 1; box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px var(--cb); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 4px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; border: none; padding: 0; margin: 0; min-width: 0; }
.swatches legend { font-size: 13px; font-weight: 700; color: var(--soft); padding: 0; margin-bottom: 8px; }
.sw span { height: 64px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; background: var(--cb); color: var(--cf); cursor: pointer; }
.sw b { font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1; }
.sw small { font-size: 11px; font-weight: 700; margin-top: 6px; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw input:checked + span { box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px var(--accent); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 4px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.err { color: var(--danger); font-size: 13px; font-weight: 700; margin: 0; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet-foot .spacer { flex: 1; }
.confirm { border: 1px solid var(--danger); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; font-weight: 600; }
.list-row { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.list-row .name { flex: 1; min-width: 0; font-weight: 600; }
.add-hab { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto; gap: 8px; }
@media (max-width: 480px) { .add-hab { grid-template-columns: minmax(0, 1fr) auto; } .add-hab select { grid-column: 1 / -1; grid-row: 2; } }
.status { font-size: 13px; font-weight: 700; color: var(--accent); min-height: 18px; margin: 0; }
textarea.field { min-height: 90px; padding: 10px 12px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="top">
    <div>
      <h1 id="dayTitle">Сегодня</h1>
      <div class="sub" id="daySub"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" type="button" data-act="go-today" id="todayBtn">Сегодня</button>
      <button class="icon-btn glass" type="button" data-act="menu" aria-label="Категории, привычки и данные">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
      </button>
      <button class="btn primary" type="button" data-act="new">+ Новый блок</button>
    </div>
  </header>

  <nav class="week" aria-label="Дни недели">
    <button class="icon-btn glass" type="button" data-act="week-prev" aria-label="Предыдущая неделя">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div class="days" id="days"></div>
    <button class="icon-btn glass" type="button" data-act="week-next" aria-label="Следующая неделя">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </nav>

  <div class="main">
    <div class="daycol">
      <div class="pet-lane glass" id="petLane">
        <div class="pet-cap"><b id="petName">Рокки</b><span id="petMood"></span></div>
        <div class="pet-track" aria-hidden="true"></div>
        <button type="button" class="pet" id="pet" data-act="pet" aria-label="Питомец Рокки: нажми, и он прогуляется">

          <input class="field" id="inboxInput" type="text" placeholder="Задача без времени" autocomplete="off" maxlength="200">
          <button class="icon-btn btn primary" style="padding:0" type="submit" aria-label="Добавить задачу">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </form>
        <div id="inbox"></div>
      </section>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
</div>
<div id="sheetRoot"></div>

<script>
(function () {
  'use strict';
  var KEY = 'night-planner.v1';
  /* Цветовые пары «фон + текст»: дофаминовые палитры, текст подобран так, чтобы читался */
  var PAIRS = {
    periwinkle: { name: 'Барвинок', bg: '#9D96FF', fg: '#1F1470' },
    tuscan: { name: 'Тоскана', bg: '#FAC75A', fg: '#8A1268' },
    lime: { name: 'Лайм', bg: '#98B10F', fg: '#2A0B38' },
    blush: { name: 'Пудра', bg: '#FFA296', fg: '#5C1442' },
    salad: { name: 'Салат', bg: '#BEDA62', fg: '#3B2D9E' },
    sky: { name: 'Небо', bg: '#81CFFF', fg: '#1B3A8F' },
    lavender: { name: 'Лаванда', bg: '#F9EAFF', fg: '#8A2FB0' },
    orchid: { name: 'Орхидея', bg: '#C2309F', fg: '#FFFFFF' },
    canary: { name: 'Канарейка', bg: '#F6F67B', fg: '#4D5C00' },
    amethyst: { name: 'Аметист', bg: '#A144C5', fg: '#FFF3FA' },
    mist: { name: 'Розовый туман', bg: '#FFEAFC', fg: '#B0247F' },
    mauve: { name: 'Мов', bg: '#BCA4F5', fg: '#2D1060' },
    lemonade: { name: 'Лимонад', bg: '#ECFFBE', fg: '#6A2FB8' }
  };
  var PAIR_KEYS = Object.keys(PAIRS);
  var DEFAULT_CATS = [
    { id: 'work', name: 'Работа', pair: 'periwinkle' },
    { id: 'study', name: 'Учёба', pair: 'tuscan' },
    { id: 'sport', name: 'Спорт', pair: 'lime' },
    { id: 'life', name: 'Личное', pair: 'blush' },
    { id: 'health', name: 'Здоровье', pair: 'salad' },
    { id: 'meet', name: 'Встречи', pair: 'sky' },
    { id: 'rest', name: 'Отдых', pair: 'lavender' },
    { id: 'grow', name: 'Развитие', pair: 'orchid' }
  ];
  var WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var WDFULL = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
  var MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var REPEAT = { none: 'Не повторять', daily: 'Каждый день', weekdays: 'По будням', weekly: 'Каждую неделю' };
  var CHECK_SVG = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>';
  var X_SVG = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
  var REP_SVG = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>';
  var SPARK_SVG = '<svg class="spark" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z"></path></svg>';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function dow(s) { return (parse(s).getDay() + 6) % 7; }
  function toMin(t) { var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }
  function fmtMin(m) { return Math.floor(m / 60) + ':' + pad(m % 60); }
  function hhmm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function fmtDur(m) { var h = Math.floor(m / 60), r = m % 60; if (!h) return r + ' мин'; if (!r) return h + ' ч'; return h + ' ч ' + r + ' м'; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function today() { return iso(new Date()); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function mk(title, cat, start, end, date, repeat) {
    return { id: uid(), title: title, cat: cat, start: start, end: end, date: date, repeat: repeat, skip: [], done: {}, example: true };
  }
  function seed() {
    var t = today();
    return {
      v: 2,
      cats: DEFAULT_CATS.map(function (c) { return { id: c.id, name: c.name, pair: c.pair }; }),
      events: [
        mk('Зарядка', 'sport', '08:00', '08:30', t, 'daily'),
        mk('Английский', 'study', '08:30', '09:15', t, 'weekdays'),
        mk('Работа над проектом', 'work', '09:30', '11:00', t, 'none'),
        mk('Созвон с командой', 'meet', '11:00', '11:30', t, 'none'),
        mk('Документы и почта', 'work', '11:30', '13:00', t, 'none'),
        mk('Обед', 'life', '13:00', '14:00', t, 'daily'),
        mk('Фокус-время', 'work', '14:00', '16:30', t, 'none'),
        mk('Прогулка', 'health', '16:30', '17:00', t, 'none'),
        mk('Онлайн-курс', 'study', '17:00', '18:30', t, 'weekdays'),
        mk('Лекция', 'grow', '19:00', '20:00', t, 'none'),
        mk('Сериал и чай', 'rest', '20:30', '22:00', t, 'none')
      ],
      habits: [
        { id: uid(), name: 'Зарядка', cat: 'sport', log: {} },
        { id: uid(), name: 'Английский', cat: 'study', log: {} },
        { id: uid(), name: '2 л воды', cat: 'health', log: {} },
        { id: uid(), name: 'Чтение 20 мин', cat: 'grow', log: {} }
      ],
      inbox: [],
      pet: { name: 'Рокки', x: 0.1 },
      exv: 2
    };
  }
  function valid(s) { return s && Array.isArray(s.events) && Array.isArray(s.habits) && Array.isArray(s.inbox); }
  function norm(s) {
    if (!Array.isArray(s.cats) || !s.cats.length) s.cats = DEFAULT_CATS.map(function (c) { return { id: c.id, name: c.name, pair: c.pair }; });
    s.cats.forEach(function (c) { if (!PAIRS[c.pair]) c.pair = 'periwinkle'; });
    var first = s.cats[0].id;
    var has = function (id) { return s.cats.some(function (c) { return c.id === id; }); };
    if (s.exv !== 2) {
      var hadEx = s.events.some(function (e) { return e.example; });
      s.events = s.events.filter(function (e) { return !e.example; });
      if (hadEx) s.events = s.events.concat(seed().events);
      s.exv = 2;
    }
    if (!s.pet || typeof s.pet !== 'object') s.pet = { name: 'Рокки', x: 0.1 };
    if (!s.pet.name) s.pet.name = 'Рокки';
    if (!(s.pet.x >= 0 && s.pet.x <= 1)) s.pet.x = 0.1;
    s.events.forEach(function (e) { e.skip = e.skip || []; e.done = e.done || {}; e.repeat = REPEAT[e.repeat] ? e.repeat : 'none'; if (!has(e.cat)) e.cat = first; });
    s.habits.forEach(function (h) { h.log = h.log || {}; if (!has(h.cat)) h.cat = first; });
    s.v = 2;
    return s;
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (valid(s)) return norm(s); } } catch (e) {}
    return seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var S = load();
  var sel = today();
  var lastToday = today();

  function cat(id) { for (var i = 0; i < S.cats.length; i++) if (S.cats[i].id === id) return S.cats[i]; return S.cats[0]; }
  function pairOf(catId) { return PAIRS[cat(catId).pair] || PAIRS.periwinkle; }
  function cvars(catId) { var p = pairOf(catId); return '--cb:' + p.bg + ';--cf:' + p.fg; }
  function pvars(key) { var p = PAIRS[key]; return '--cb:' + p.bg + ';--cf:' + p.fg; }

  function occurs(e, d) {
    if (d < e.date) return false;
    if (e.skip && e.skip.indexOf(d) >= 0) return false;
    if (e.repeat === 'daily') return true;
    if (e.repeat === 'weekdays') return dow(d) < 5;
    if (e.repeat === 'weekly') return dow(d) === dow(e.date);
    return d === e.date;
  }
  function eventsOn(d) {
    return S.events.filter(function (e) { return occurs(e, d); }).sort(function (a, b) {
      return toMin(a.start) - toMin(b.start) || toMin(a.end) - toMin(b.end);
    });
  }
  function dur(e) { return Math.max(0, toMin(e.end) - toMin(e.start)); }
  function findEv(id) { for (var i = 0; i < S.events.length; i++) if (S.events[i].id === id) return S.events[i]; return null; }
  function findHab(id) { for (var i = 0; i < S.habits.length; i++) if (S.habits[i].id === id) return S.habits[i]; return null; }
  function streak(h) {
    var d = today(), c = 0;
    if (!h.log[d]) d = addDays(d, -1);
    while (h.log[d]) { c++; d = addDays(d, -1); }
    return c;
  }
  function plural(n, one, few, many) { var a = n % 10, b = n % 100; if (a === 1 && b !== 11) return one; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few; return many; }

  /* ---------- render ---------- */
  function renderHeader() {
    var t = today(), title;
    if (sel === t) title = 'Сегодня';
    else if (sel === addDays(t, 1)) title = 'Завтра';
    else if (sel === addDays(t, -1)) title = 'Вчера';
    else { title = WDFULL[dow(sel)]; title = title.charAt(0).toUpperCase() + title.slice(1); }
    var d = parse(sel), list = eventsOn(sel), total = 0;
    list.forEach(function (e) { total += dur(e); });
    var sub = d.getDate() + ' ' + MON[d.getMonth()];
    if (title === 'Сегодня' || title === 'Завтра' || title === 'Вчера') sub += ' · ' + WDFULL[dow(sel)];
    sub += list.length ? ' · ' + list.length + ' ' + plural(list.length, 'блок', 'блока', 'блоков') + ', ' + fmtDur(total) : ' · свободный день';
    $('dayTitle').textContent = title;
    $('daySub').textContent = sub;
    $('todayBtn').hidden = sel === t;
  }

  function renderWeek() {
    var mon = addDays(sel, -dow(sel)), t = today(), html = '';
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), list = eventsOn(d), bars = '';
      list.slice(0, 8).forEach(function (e) {
        var w = Math.max(3, Math.round(dur(e) / 60 * 4));
        bars += '<i style="width:' + w + 'px;background:' + pairOf(e.cat).bg + '"></i>';
      });
      var lab = parse(d).getDate() + ' ' + MON[parse(d).getMonth()] + ', ' + WDFULL[i] + (list.length ? ', ' + list.length + ' ' + plural(list.length, 'блок', 'блока', 'блоков') : '');
      html += '<button type="button" class="day-btn glass' + (d === t ? ' is-today' : '') + '" data-act="sel" data-date="' + d + '" aria-pressed="' + (d === sel) + '" aria-label="' + lab + '">' +
        '<span class="wd">' + WD[i] + '</span><span class="n">' + parse(d).getDate() + '</span>' +
        '<span class="load">' + bars + '</span></button>';
    }
    $('days').innerHTML = html;
  }

  function renderDay() {
    var list = eventsOn(sel), isToday = sel === today(), n = nowMin(), html = '';
    if (!list.length) {
      html += '<div class="empty"><strong>На этот день ничего нет</strong><span>Добавь первый блок: время, название и цвет.</span>' +
        '<button type="button" class="btn primary" data-act="new">+ Новый блок</button></div>';
    }
    var prevEnd = null;
    list.forEach(function (e) {
      var s = toMin(e.start), en = toMin(e.end), m = en - s;
      if (prevEnd !== null && s - prevEnd >= 15) {
        html += '<button type="button" class="gap" data-act="new" data-start="' + hhmm(prevEnd) + '" data-end="' + hhmm(s) + '">' +
          '<span aria-hidden="true">+</span> Свободно ' + fmtDur(s - prevEnd) + ' · ' + fmtMin(prevEnd) + '–' + fmtMin(s) + '</button>';
      }
      prevEnd = prevEnd === null ? en : Math.max(prevEnd, en);
      var done = !!e.done[sel];
      var now = isToday && s <= n && n < en;
      var h = Math.max(46, Math.min(200, Math.round(30 + m / 60 * 20)));
      html += '<div class="row"><div class="t">' + fmtMin(s) + '</div>' +
        '<div class="card' + (done ? ' is-done' : '') + (now ? ' is-now' : '') + '" style="' + cvars(e.cat) + ';height:' + h + 'px">' +
        '<button type="button" class="check" data-act="toggle" data-id="' + e.id + '" aria-pressed="' + done + '" aria-label="' + (done ? 'Снять отметку: ' : 'Отметить выполненным: ') + esc(e.title) + '">' + CHECK_SVG + '</button>' +
        '<button type="button" class="open" data-act="edit" data-id="' + e.id + '" aria-label="Изменить: ' + esc(e.title) + ', ' + fmtMin(s) + '–' + fmtMin(en) + ', ' + esc(cat(e.cat).name) + '">' +
        (now ? SPARK_SVG : '') + '<span class="title">' + esc(e.title) + '</span>' +
        '<span class="meta">' + (now ? '<span class="pill">сейчас</span>' : '') +
        (e.repeat !== 'none' ? '<span class="rep" title="' + REPEAT[e.repeat] + '">' + REP_SVG + '</span>' : '') +
        fmtDur(m) + '</span></button></div></div>';
    });
    $('daylist').innerHTML = html;
  }

  function renderNow() {
    var t = today(), list = eventsOn(t), n = nowMin(), cur = null, next = null, html, panel = $('nowPanel');
    for (var i = 0; i < list.length; i++) {
      var s = toMin(list[i].start), en = toMin(list[i].end);
      if (s <= n && n < en && !cur) cur = list[i];
      if (s > n && !next) next = list[i];
    }
    panel.className = 'panel glass';
    panel.removeAttribute('style');
    if (cur) {
      var s0 = toMin(cur.start), e0 = toMin(cur.end), pct = Math.round((n - s0) / Math.max(1, e0 - s0) * 100);
      var done = !!cur.done[t];
      panel.className = 'panel lit';
      panel.setAttribute('style', cvars(cur.cat));
      html = '<div class="label">Сейчас · ' + esc(cat(cur.cat).name) + '</div><div class="now-title">' + esc(cur.title) + '</div>' +
        '<div class="muted">' + fmtMin(s0) + '–' + fmtMin(e0) + ' · осталось ' + fmtDur(e0 - n) + '</div>' +
        '<div class="bar" role="progressbar" aria-label="Прошло времени блока" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
        '<button type="button" class="btn' + (done ? ' ghost' : '') + '" data-act="now-done" data-id="' + cur.id + '">' + (done ? 'Выполнено · снять отметку' : 'Готово') + '</button>';
      if (next) html += '<div class="muted">Дальше: ' + esc(next.title) + ' в ' + fmtMin(toMin(next.start)) + '</div>';
    } else if (next) {
      var wait = toMin(next.start) - n;
      html = '<div class="label">Дальше</div><div style="display:flex;align-items:center;gap:10px"><span class="tag" style="' + cvars(next.cat) + '">' + fmtMin(toMin(next.start)) + '</span><div class="now-title">' + esc(next.title) + '</div></div>' +
        '<div class="muted">через ' + fmtDur(wait) + '</div>';
    } else {
      html = '<div class="label">Сейчас</div><div class="now-title">' + (list.length ? 'На сегодня всё' : 'Сегодня свободно') + '</div>' +
        '<div class="muted">' + (list.length ? 'Можно отдохнуть или запланировать завтра.' : 'Добавь блок, и он появится здесь.') + '</div>';
    }
    panel.innerHTML = html;
  }

  function renderProg() {
    var list = eventsOn(sel), total = list.length, done = 0;
    list.forEach(function (e) { if (e.done[sel]) done++; });
    var frac = total ? done / total : 0, C = 314.16;
    $('progPanel').innerHTML =
      '<svg role="img" aria-label="Выполнено ' + Math.round(frac * 100) + ' процентов" width="96" height="96" viewBox="0 0 120 120" style="flex:none">' +
      '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA296"></stop><stop offset="0.5" stop-color="#F6F67B"></stop><stop offset="1" stop-color="#BEDA62"></stop></linearGradient></defs>' +
      '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="14"></circle>' +
      '<circle cx="60" cy="60" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + (frac * C).toFixed(1) + ' ' + C + '" transform="rotate(-90 60 60)"' + (done ? '' : ' visibility="hidden"') + '></circle>' +
      '<text x="60" y="68" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="24" font-weight="800" fill="var(--fg)">' + Math.round(frac * 100) + '%</text></svg>' +
      '<div><div class="big">' + done + ' из ' + total + '</div><div class="muted">' + (sel === today() ? 'блоков закрыто сегодня' : 'блоков закрыто в этот день') + '</div>' +
      (total && done === total ? '<div style="margin-top:6px;font-weight:800;color:var(--accent)">Всё сделано!</div>' : '') + '</div>';
  }

  function renderHabits() {
    var html = '';
    S.habits.forEach(function (h) {
      var on = !!h.log[sel], st = streak(h);
      html += '<button type="button" class="chip" style="' + cvars(h.cat) + '" data-act="habit" data-id="' + h.id + '" aria-pressed="' + on + '">' +
        esc(h.name) + (st > 1 ? ' · ' + st + ' ' + plural(st, 'день', 'дня', 'дней') : '') + '</button>';
    });
    if (!S.habits.length) html = '<span class="muted">Привычек пока нет.</span>';
    html += '<button type="button" class="link-btn" data-act="menu">Настроить</button>';
    $('habits').innerHTML = html;
  }

  function renderInbox() {
    var items = S.inbox.slice().sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); }), html = '';
    items.forEach(function (it) {
      html += '<div class="todo' + (it.done ? ' is-done' : '') + '"><input type="checkbox" id="in-' + it.id + '" data-act="inbox-toggle" data-id="' + it.id + '"' + (it.done ? ' checked' : '') + '>' +
        '<label for="in-' + it.id + '">' + esc(it.title) + '</label>' +
        '<button type="button" class="x" data-act="inbox-del" data-id="' + it.id + '" aria-label="Удалить: ' + esc(it.title) + '">' + X_SVG + '</button></div>';
    });
    if (!items.length) html = '<p class="hint">Сюда попадают дела без времени. Напиши задачу и нажми плюс.</p>';
    else if (items.some(function (i) { return i.done; })) html += '<button type="button" class="link-btn" data-act="inbox-clear">Убрать выполненные</button>';
    $('inbox').innerHTML = html;
  }

  function renderLegend() {
    $('legend').innerHTML = S.cats.map(function (c) { return '<span class="tag" style="' + pvars(c.pair) + '">' + esc(c.name) + '</span>'; }).join('');
  }

  function render() {
    renderHeader(); renderWeek(); renderDay(); renderNow(); renderProg(); renderHabits(); renderInbox(); renderLegend(); renderPet();
  }

  /* ---------- питомец ---------- */
  var petBtn = $('pet'), petBubble = $('petBubble'), petLane = $('petLane');
  var facing = 1, bubbleTimer = null, walkTimer = null, cheerTimer = null;
  var TAP = ['Чего уставилась?', 'Я не милый. Я Рокки.', 'Гуляю где хочу.', 'Хаос по расписанию.', 'Ну давай, ещё блок.', 'Тыкать в Рокки — смело.', 'Я тут главный. Шучу. Нет.', 'Планы — это бунт с дедлайном.'];
  var YAY = ['Система трепещет.', 'Один блок пал.', 'Неплохо. Для человека.', 'Дедлайн повержен.', 'Так им и надо.', 'Продолжай. Я слежу.'];
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function renderPet() {
    $('petName').textContent = S.pet.name;
    petBtn.setAttribute('aria-label', 'Питомец ' + S.pet.name + ': нажми, и он прогуляется');
    var list = eventsOn(sel), done = 0;
    list.forEach(function (e) { if (e.done[sel]) done++; });
    var mood;
    if (!list.length) mood = 'скучает: в этот день пусто';
    else if (done === list.length) mood = 'одобряет. Редкость.';
    else if (!done) mood = 'ждёт, когда ты начнёшь';
    else if (done / list.length >= 0.5) mood = 'почти впечатлён: ' + done + ' из ' + list.length;
    else mood = 'следит: ' + done + ' из ' + list.length;
    $('petMood').textContent = mood;
  }
  function placePet(x, dur) {
    petBtn.style.transitionDuration = (reduced ? 0 : dur) + 's';
    petBtn.style.setProperty('--x', x.toFixed(3));
    petBtn.classList.toggle('face-left', facing < 0);
  }
  function say(text) {
    petBubble.textContent = text;
    petBubble.hidden = false;
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { petBubble.hidden = true; }, 2200);
  }
  function walkTo(x) {
    x = Math.max(0, Math.min(1, x));
    var dist = Math.abs(x - S.pet.x);
    if (dist < 0.01) return;
    facing = x > S.pet.x ? 1 : -1;
    var dur = 0.5 + dist * 2.2;
    S.pet.x = x; save();
    petBtn.classList.add('walking');
    placePet(x, dur);
    clearTimeout(walkTimer);
    walkTimer = setTimeout(function () { petBtn.classList.remove('walking'); }, dur * 1000);
  }
  function sparkles(n) {
    if (reduced) return;
    var laneBox = petLane.getBoundingClientRect(), b = petBtn.getBoundingClientRect();
    var cx = b.left - laneBox.left + b.width / 2, cy = b.top - laneBox.top + 10;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span'), k = PAIRS[pick(PAIR_KEYS)];
      s.className = 'fx';
      s.innerHTML = SPARK_SVG;
      s.style.left = (cx - 8 + (Math.random() * 40 - 20)) + 'px';
      s.style.top = (cy + Math.random() * 20) + 'px';
      s.style.color = k.bg;
      s.style.setProperty('--dx', (Math.random() * 70 - 35).toFixed(0) + 'px');
      s.style.animationDelay = (i * 0.05) + 's';
      petLane.appendChild(s);
      setTimeout((function (el) { return function () { el.remove(); }; })(s), 1400);
    }
  }
  function cheer(big) {
    petBtn.classList.remove('cheer');
    void petBtn.offsetWidth;
    petBtn.classList.add('cheer');
    clearTimeout(cheerTimer);
    cheerTimer = setTimeout(function () { petBtn.classList.remove('cheer'); }, 800);
    sparkles(big ? 14 : 6);
    say(big ? 'День повержен. Можно бунтовать.' : pick(YAY));
    var nx = S.pet.x + facing * 0.16;
    if (nx > 1 || nx < 0) { facing = -facing; nx = S.pet.x + facing * 0.16; }
    walkTo(nx);
  }
  function petTap() {
    var nx, tries = 0;
    do { nx = Math.random(); tries++; } while (Math.abs(nx - S.pet.x) < 0.25 && tries < 10);
    say(pick(TAP));
    walkTo(nx);
  }
  function dayAllDone(d) {
    var l = eventsOn(d);
    return l.length > 0 && l.every(function (e) { return e.done[d]; });
  }
  placePet(S.pet.x, 0);
  setInterval(function () {
    if (document.hidden || sheetCtx || petBtn.classList.contains('walking') || Math.random() < 0.4) return;
    walkTo(S.pet.x + (Math.random() * 0.3 - 0.15));
  }, 25000);

  /* ---------- sheets ---------- */

  function catPicker(cur) {

      }).join('') + '</select></label></div>' +

      '<p class="err" id="f-err" hidden></p>' +
      '<div class="confirm" id="delBox" hidden><p>' + (rep ? 'Это повторяющийся блок. Что удалить?' : 'Удалить этот блок?') + '</p><div class="sheet-foot">' +
      (rep ? '<button type="button" class="btn danger small" data-act="del-one">Только ' + parse(sel).getDate() + ' ' + MON[parse(sel).getMonth()] + '</button><button type="button" class="btn danger small" data-act="del-all">Все повторы</button>'

  function defaultStart() {
    var list = eventsOn(sel), m = 9 * 60;
    if (sel === today()) m = Math.ceil(nowMin() / 15) * 15;
    if (list.length) {
      var lastEnd = toMin(list[list.length - 1].end);
      if (sel !== today() || lastEnd > m) m = Math.max(m, lastEnd);
    }
    return hhmm(Math.min(m, 22 * 60));
  }

  function saveEditor() {
    var title = $('f-title').value.trim(), start = $('f-start').value, end = $('f-end').value, date = $('f-date').value, repeat = $('f-repeat').value;
    var catEl = document.querySelector('input[name="f-cat"]:checked'), c = catEl ? catEl.value : S.cats[0].id;
    var err = '';
    if (!title) err = 'Напиши название блока.';
    else if (!start || !end) err = 'Укажи время начала и конца.';
    else if (toMin(end) <= toMin(start)) err = 'Конец должен быть позже начала. Блоки через полночь пока не поддерживаются.';
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) err = 'Укажи дату.';
    if (err) { var el = $('f-err'); el.textContent = err; el.hidden = false; return; }
    var e = sheetCtx.id ? findEv(sheetCtx.id) : null;
    if (e) {
      e.title = title; e.cat = c; e.start = start; e.end = end; e.repeat = repeat; e.date = date; e.example = false;
    } else {
      S.events.push({ id: uid(), title: title, cat: c, start: start, end: end, date: date, repeat: repeat, skip: [], done: {} });
    }
    if (repeat === 'none' || !sheetCtx.id) sel = date;
    save(); closeSheet(); render();
  }

  function openMenu(msg) {
    var html = '<h2 id="sheetTitle">Настройки</h2>' +
      '<h3>Категории и цвета</h3><div id="catList">' + catListHtml() + '</div>' +

      '<form class="add-hab" id="habForm"><label class="sr" for="h-name">Новая привычка</label><input class="field" id="h-name" type="text" maxlength="40" placeholder="Новая привычка" autocomplete="off">' +
      '<label class="sr" for="h-cat">Цвет</label><select class="field" id="h-cat">' + S.cats.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select>' +
      '<button type="submit" class="btn primary small" style="min-height:46px">Добавить</button></form>' +

        '<button type="button" class="btn small" style="align-self:flex-start" data-act="clear-examples" data-confirm="Точно убрать примеры?">Убрать примеры блоков</button>' : '') +
      '<h3>Резервная копия</h3><p class="hint">Все данные хранятся только на этом устройстве. Иногда сохраняй копию, чтобы ничего не потерять и перенести планы на другое устройство.</p>' +
      '<div class="sheet-foot"><button type="button" class="btn small" data-act="export-file">Скачать файл</button><button type="button" class="btn small" data-act="export-copy">Скопировать в буфер</button>' +
      '<label class="btn small" style="display:inline-flex;align-items:center;cursor:pointer" for="importFile">Восстановить из файла</label><input class="sr" type="file" id="importFile" accept="application/json,.json"></div>' +
      '<label class="f"><span>Или вставь копию сюда</span><textarea class="field" id="importText" spellcheck="false" placeholder="{&quot;v&quot;:2, ...}"></textarea></label>' +
      '<div class="sheet-foot"><button type="button" class="btn small" data-act="import-text">Восстановить из текста</button><span class="spacer"></span>' +
      '<button type="button" class="btn danger small" data-act="reset" data-confirm="Точно стереть всё?">Стереть все данные</button></div>' +
      '<p class="status" id="menuStatus" role="status">' + (msg ? esc(msg) : '') + '</p>' +
      '<div class="sheet-foot"><span class="spacer"></span><button type="button" class="btn primary" data-act="close">Готово</button></div>';
    openSheet(html, { kind: 'menu' });
  }
  function catListHtml() {
    return S.cats.map(function (c) {
      var n = S.events.filter(function (e) { return e.cat === c.id; }).length;
      return '<div class="list-row"><span class="tag" style="' + pvars(c.pair) + '">' + esc(c.name) + '</span><span class="name muted">' + (n ? n + ' ' + plural(n, 'блок', 'блока', 'блоков') : 'пока пусто') + '</span>' +
        '<button type="button" class="btn ghost small" data-act="cat-edit" data-id="' + c.id + '">Изменить</button></div>';
    }).join('');
  }

      return '<div class="list-row"><span class="tag" style="' + cvars(h.cat) + '">' + esc(h.name) + '</span><span class="name"></span>' +
        '<button type="button" class="x" data-act="hab-del" data-id="' + h.id + '" data-confirm="?" aria-label="Удалить привычку ' + esc(h.name) + '">' + X_SVG + '</button></div>';
    }).join('');
  }

  function openCatEditor(id) {
    var c = id ? cat(id) : null;
    var cur = c ? c.pair : PAIR_KEYS.filter(function (k) { return !S.cats.some(function (x) { return x.pair === k; }); })[0] || 'canary';
    var html = '<h2 id="sheetTitle">' + (c ? 'Категория' : 'Новая категория') + '</h2>' +
      '<form id="catForm" class="f" style="gap:16px" novalidate>' +
      '<label class="f"><span>Название</span><input class="field" id="c-name" type="text" maxlength="24" autocomplete="off" value="' + (c ? esc(c.name) : '') + '" placeholder="Например, Семья"' + (c ? '' : ' autofocus') + '></label>' +
      '<fieldset class="swatches"><legend>Цвет блока</legend>' + PAIR_KEYS.map(function (k) {

      }).join('') + '</fieldset>' +
      '<p class="err" id="c-err" hidden></p>' +
      '<div class="confirm" id="catDelBox" hidden><p>Удалить категорию? Её блоки и привычки перейдут в «' + esc((S.cats[0].id === id ? (S.cats[1] || S.cats[0]) : S.cats[0]).name) + '».</p><div class="sheet-foot">' +
      '<button type="button" class="btn danger small" data-act="cat-del">Удалить</button><button type="button" class="btn ghost small" data-act="cat-del-cancel">Оставить</button></div></div>' +

  function saveCat() {
    var name = $('c-name').value.trim(), pEl = document.querySelector('input[name="c-pair"]:checked'), p = pEl ? pEl.value : 'periwinkle';
    if (!name) { var el = $('c-err'); el.textContent = 'Напиши название категории.'; el.hidden = false; return; }

  function status(msg) { var el = $('menuStatus'); if (el) el.textContent = msg; }
  function applyImport(text) {
    var s;
    try { s = JSON.parse(text); } catch (e) { status('Не получилось прочитать копию: это не похоже на файл планера.'); return; }
    if (!valid(s)) { status('В копии нет блоков или привычек. Проверь, что это файл планера.'); return; }
    S = norm(s); save(); render(); openMenu('Данные восстановлены.');
  }

  /* ---------- events ---------- */
  function armed(btn) {
    if (!btn.hasAttribute('data-confirm')) return true;
    if (btn.getAttribute('data-armed') === '1') return true;
    btn.setAttribute('data-armed', '1');
    btn.setAttribute('data-label', btn.innerHTML);
    var txt = btn.getAttribute('data-confirm');
    btn.innerHTML = txt === '?' ? 'Удалить?' : esc(txt);
    if (txt === '?') { btn.style.width = 'auto'; btn.style.padding = '0 10px'; btn.style.color = 'var(--danger)'; }
    setTimeout(function () {
      if (btn.getAttribute('data-armed') === '1') { btn.removeAttribute('data-armed'); btn.innerHTML = btn.getAttribute('data-label'); btn.style.cssText = ''; }
    }, 4000);
    return false;
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'scrim') { if (ev.target === t) closeSheet(); return; }
    if (act === 'inbox-toggle') return;
    switch (act) {
      case 'sel': sel = t.getAttribute('data-date'); render(); break;
      case 'week-prev': sel = addDays(sel, -7); render(); break;
      case 'week-next': sel = addDays(sel, 7); render(); break;
      case 'go-today': sel = today(); render(); break;
      case 'toggle': {
        var e = findEv(id); if (!e) break;
        if (e.done[sel]) delete e.done[sel]; else e.done[sel] = true;
        save(); render();
        if (e.done[sel]) cheer(dayAllDone(sel));
        break;
      }
      case 'now-done': {
        var e2 = findEv(id), d = today(); if (!e2) break;
        if (e2.done[d]) delete e2.done[d]; else e2.done[d] = true;
        save(); render();
        if (e2.done[d]) cheer(dayAllDone(d));
        break;
      }
      case 'pet': petTap(); break;
      case 'pet-save': {
        var pn = $('p-name').value.trim();
        if (pn) { S.pet.name = pn.slice(0, 20); save(); renderPet(); status('Имя сохранено.'); }
        break;
      }
      case 'edit': openEditor(id); break;
      case 'new': openEditor(null, { start: t.getAttribute('data-start'), end: t.getAttribute('data-end') }); break;
      case 'habit': {
        var h = findHab(id); if (!h) break;
        if (h.log[sel]) delete h.log[sel]; else h.log[sel] = true;
        save(); renderHabits();
        if (h.log[sel]) cheer(false);
        break;
      }
      case 'inbox-del': S.inbox = S.inbox.filter(function (i) { return i.id !== id; }); save(); renderInbox(); break;
      case 'inbox-clear': S.inbox = S.inbox.filter(function (i) { return !i.done; }); save(); renderInbox(); break;
      case 'clear-examples':
        if (!armed(t)) break;
        S.events = S.events.filter(function (e) { return !e.example; }); save(); render(); openMenu('Примеры убраны.'); break;
      case 'menu': openMenu(); break;
      case 'back-menu': openMenu(); break;
      case 'close': closeSheet(); break;
      case 'del-ask': $('delBox').hidden = false; t.hidden = true; break;
      case 'del-cancel': $('delBox').hidden = true; var da = document.querySelector('[data-act="del-ask"]'); if (da) da.hidden = false; break;
      case 'del-one': {
        var e3 = findEv(sheetCtx.id); if (e3) e3.skip.push(sel);
        save(); closeSheet(); render(); break;
      }
      case 'del-all': S.events = S.events.filter(function (e) { return e.id !== sheetCtx.id; }); save(); closeSheet(); render(); break;
      case 'cat-edit': openCatEditor(id); break;
      case 'cat-new': openCatEditor(null); break;
      case 'cat-del-ask': $('catDelBox').hidden = false; t.hidden = true; break;
      case 'cat-del-cancel': $('catDelBox').hidden = true; var cd = document.querySelector('[data-act="cat-del-ask"]'); if (cd) cd.hidden = false; break;
      case 'cat-del': {
        var gone = sheetCtx.id;
        S.cats = S.cats.filter(function (c) { return c.id !== gone; });
        var to = S.cats[0].id;
        S.events.forEach(function (e) { if (e.cat === gone) e.cat = to; });
        S.habits.forEach(function (h) { if (h.cat === gone) h.cat = to; });
        save(); render(); openMenu('Категория удалена.'); break;
      }
      case 'hab-del':
        if (!armed(t)) break;
        S.habits = S.habits.filter(function (h) { return h.id !== id; }); save(); $('habList').innerHTML = habListHtml(); renderHabits(); break;
      case 'export-file': {
        try {
          var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = 'planer-' + today() + '.json';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          status('Файл копии сохраняется. Если ничего не скачалось, используй «Скопировать в буфер».');
        } catch (e) { status('Скачать не получилось. Используй «Скопировать в буфер».'); }
        break;
      }
      case 'export-copy': {
        var txt = JSON.stringify(S);
        var fallback = function () { var ta = $('importText'); ta.value = txt; ta.focus(); ta.select(); status('Копия в поле ниже: выдели и скопируй её вручную.'); };
        try { navigator.clipboard.writeText(txt).then(function () { status('Копия в буфере обмена. Вставь её в заметки или отправь себе.'); }, fallback); } catch (e) { fallback(); }
        break;
      }
      case 'import-text': applyImport($('importText').value.trim()); break;
      case 'reset':
        if (!armed(t)) break;
        S = norm({ v: 2, events: [], habits: [], inbox: [] }); save(); render(); openMenu('Все данные стёрты.'); break;
    }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.getAttribute('data-act') === 'inbox-toggle') {
      S.inbox.forEach(function (i) { if (i.id === t.getAttribute('data-id')) i.done = t.checked; });
      save(); renderInbox();
      if (t.checked) cheer(false);
    }
    if (t.id === 'importFile' && t.files && t.files[0]) {
      var r = new FileReader();
      r.onload = function () { applyImport(String(r.result)); };
      r.onerror = function () { status('Не получилось открыть файл.'); };
      r.readAsText(t.files[0]);
      t.value = '';
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.id === 'evForm') saveEditor();
    else if (f.id === 'catForm') saveCat();
    else if (f.id === 'inboxForm') {
      var inp = $('inboxInput'), v = inp.value.trim();
      if (!v) return;
      S.inbox.push({ id: uid(), title: v, done: false }); inp.value = ''; save(); renderInbox();
    } else if (f.id === 'habForm') {
      var nm = $('h-name').value.trim();
      if (!nm) return;
      S.habits.push({ id: uid(), name: nm, cat: $('h-cat').value, log: {} });
      $('h-name').value = ''; save(); $('habList').innerHTML = habListHtml(); renderHabits();
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && sheetCtx) closeSheet();
  });

  function tick() {
    var t = today();
    if (t !== lastToday) { if (sel === lastToday) sel = t; lastToday = t; }
    renderHeader(); renderWeek(); renderDay(); renderNow(); renderProg();
  }
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
